name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range is engines.node (>=24); 26 is the .nvmrc LTS and the
        # only leg that uploads coverage and the build artifact.
        node-version: ['24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint:check

      - name: Run formatter check
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Test CLI
        run: |
          echo '{"openapi": "3.0.0", "info": {"title": "Test", "version": "1.0.0"}, "paths": {}}' > test-openapi.json
          node ./dist/src/cli.js --input ./test-openapi.json --output generated
          ls -la generated/
          test -f generated/api.ts

      - name: Smoke test the packed CLI
        if: matrix.node-version == '26'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npx --yes --package "$(ls "$RUNNER_TEMP"/zod-codegen-*.tgz)" zod-codegen --input ./samples/swagger-petstore.yaml --output "$RUNNER_TEMP/packed"
          test -f "$RUNNER_TEMP/packed/api.ts"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.node-version == '26'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload build artifacts
        if: matrix.node-version == '26'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  zod-compat:
    name: Generated code on zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of SUPPORTED_ZOD_RANGE in src/services/client-runtime.ts ('4' is the latest 4.x).
        zod: ['4.1.12', '4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install zod ${{ matrix.zod }}
        run: npm install --no-save --no-audit --no-fund zod@${{ matrix.zod }}

      - name: Test generated clients
        run: npx vitest run tests/integration/generated-client.test.ts tests/integration/name-collisions.test.ts tests/types

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high --omit=dev

  release-preview:
    name: Release Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-${{ github.sha }}
          path: dist

      - name: Verify build output
        run: |
          test -f dist/src/cli.js || (echo "ERROR: dist/src/cli.js not found" && exit 1)
          test -f dist/src/utils/reporter.js || (echo "ERROR: dist/src/utils/reporter.js not found" && exit 1)
          echo "Build output verified successfully"

      - name: Preview semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:dry
