openapi: 3.0.0
info:
  title: Merge Keys
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Base: &base
      type: object
      properties: &baseProps
        id:
          type: string
        name:
          type: string
    Pet:
      <<: *base
      required: [id]
    Owner:
      type: object
      properties:
        <<: *baseProps
        email:
          type: string
      required: [id, email]
